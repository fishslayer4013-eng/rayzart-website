name: One-time availability cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-public-domain.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bust-availability-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Version the availability data script
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="availability-data.js"></script>'
          new = '<script src="availability-data.js?v=20260901-1"></script>'
          if new in text:
              print('Availability script already versioned; nothing to change.')
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Expected availability script tag not found; refusing to change anything.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Added cache-busting version to availability-data.js.')

      - name: Verify intended script reference
        run: |
          grep -n 'availability-data.js?v=20260901-1' index.html

      - name: Commit cache-busting homepage change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Bust availability data cache'
          git push
