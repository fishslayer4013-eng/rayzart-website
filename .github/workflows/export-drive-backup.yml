name: Export Drive Backup

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact working version
        uses: actions/checkout@v4
        with:
          ref: 149aafa6e8eff7b09348daaeec970a6f1337f7a0
      - name: Create website backup
        run: |
          zip -r "Rayzart-Website-Built-2026-08-06.zip" . -x ".git/*"
      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: rayzart-website-built-2026-08-06
          path: Rayzart-Website-Built-2026-08-06.zip
          retention-days: 1
